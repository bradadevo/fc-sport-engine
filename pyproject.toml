[project]
name = "sports-reel-engine"
version = "0.1.0"
description = "Sports photo tools: beat-synced Final Cut Pro reels and AI match culling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "librosa",
    "numpy",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pillow",
    "pillow-heif>=1.8.1",
    "pydantic>=2",
    "rawpy>=0.27.1",
    "soundfile",
]

[project.scripts]
sports-reel = "sports_reel.cli:main"
match-cull = "match_cull.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sports_reel", "match_cull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
